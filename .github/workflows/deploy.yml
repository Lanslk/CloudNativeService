name: Build and Deploy to AWS via SSM

on:
  push:
    branches:
      - main  # 當 code push 到 main 分支時觸發

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout 專案程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Java 21 環境
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Check Java Version
        run: java -version

      # 3. Maven 打包產出 Spring Boot JAR 檔
      - name: Build with Maven
        run: mvn clean package -DskipTests -Dmaven.compiler.release=21 -f "Car Rental/Car Rental Springboot/Car Rental/pom.xml"
        
      # 4. 配置 AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. 登入 AWS ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. 建置 Docker Image 並推送到 ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f "Car Rental/Car Rental Springboot/Dockerfile" "Car Rental"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 7. 透過 AWS SSM 對 ASG 內的所有 EC2 發送部署命令
      - name: Deploy to EC2 via AWS SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Sending deployment command via AWS SSM..."
          
          # 發送 SSM Run Shell Script 指令給所有指定 Tag 的 EC2
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=car-rental-*" \
            --document-name "AWS-RunShellScript" \
            --comment "Automated deployment via GitHub Actions" \
            --parameters commands="[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"cd '/home/ec2-user/app/Car Rental' || cd /home/ec2-user/app/*\",
              \"/usr/local/bin/docker-compose pull\",
              \"/usr/local/bin/docker-compose up -d\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" \
            --output text)
            
          echo "SSM Command sent successfully! Command ID: $COMMAND_ID"
          
          # 等待 SSM 命令執行完成並檢查狀態 (約等待 30 秒)
          sleep 10
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --query "CommandInvocations[*].[InstanceId, Status, StatusDetails]" \
            --output table