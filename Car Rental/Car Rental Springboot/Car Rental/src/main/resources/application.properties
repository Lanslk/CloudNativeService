spring.application.name=Car Rental
# ==========================================
# 1. 資料庫連線設定 (MySQL)
# ==========================================
# MySQL 建立的資料庫名稱
spring.datasource.url=jdbc:mysql://localhost:3306/myjdbc?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true&characterEncoding=UTF-8

# MySQL 的帳號與密碼 (請依你的環境修改)
spring.datasource.username=root
spring.datasource.password=springboot

# MySQL 驅動程式
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ==========================================
# 2. JPA / Hibernate 設定
# ==========================================
# 在 Console 印出執行的 SQL 語法 (開發除錯時非常實用)
spring.jpa.show-sql=true

# 排版 Console 印出的 SQL，方便閱讀
spring.jpa.properties.hibernate.format_sql=true

# 自動建立/更新資料表結構策略
# update: 依據 Entity 自動建立或更新 Table 欄位 (開發階段推薦)
# validate / none: 如果資料庫內已有現成表格，且不想讓 JPA 改變結構，請設為 none
spring.jpa.hibernate.ddl-auto=update

# 指定 SQL 方言
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 設定 API 規格 JSON 的路徑
springdoc.api-docs.path=/v3/api-docs

# 設定 Swagger UI 的訪問路徑
springdoc.swagger-ui.path=/swagger-ui.html