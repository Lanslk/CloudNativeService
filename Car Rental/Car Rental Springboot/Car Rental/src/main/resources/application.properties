spring.application.name=Car Rental

# ==========================================
# 1. 資料庫連線設定 (優先讀取環境變數，若無則使用預設值)
# ==========================================
# 資料庫連線 URL (預設連至 AWS RDS，資料庫名稱改為與 Terraform 一致的 carrental)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/myjdbc?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}

# MySQL 的帳號與密碼 (從環境變數讀取)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:springboot}

# MySQL 驅動程式
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ==========================================
# 2. JPA / Hibernate 設定
# ==========================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 關閉 DDL，完全交由 Flyway 建立與管理 Schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 確保 JPA 實體會在 Flyway 完成 Table 建立後才初始化
spring.jpa.defer-datasource-initialization=true

# ==========================================
# 3. Flyway 自動化腳本設定
# ==========================================
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# 指定 SQL 腳本放置目錄 (預設為 classpath:db/migration)
spring.flyway.locations=classpath:db/migration

# ==========================================
# 4. Swagger / OpenAPI 文件設定
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html