#      - ./table/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # --- 2. Spring Boot 後端 ---
  backend:
    build:
      context: ./Car Rental Springboot/Car Rental
      dockerfile: Dockerfile
    container_name: car_rental_backend
    ports:
      - "${BACKEND_PORT}:8080"
    restart: always
    environment:
      # 關鍵：注意主機名直接寫 db (docker-compose 的 service 名稱)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      - db

  # --- 3. PHP 前端 ---
  frontend:
    build:
      context: ./Car Rental website
      dockerfile: Dockerfile
    container_name: car_rental_frontend
    ports:
      - "${FRONTEND_PORT}:80"        # 將容器內的 80 埠映射到本機 8000 埠
    restart: always
    depends_on:
      - backend
    environment:
      - BACKEND_URL=${BACKEND_URL}

volumes:
  db_data: